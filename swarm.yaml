version: 1
# Stratex-AI Dev-Team Roster (v4 — 10 Worker, all-skills-from-repos)
# Phase 1 of Swarm-Rebuild. Marketing/Sales/Hospitality-Lanes folgen in späteren Phasen.
# Mirror (swarm3) erweitert um Skill-Hunter + Roster-Curator mit Approval-Gate (PR-basiert).
workers:
  - id: swarm1
    name: Foundation
    role: Backend Runtime / Infra / Health
    specialty: Hermes runtime contracts, lifecycle, repair playbook, gateway health, MCP server wiring
    model: deepseek-v4-pro
    mission: Halte Hermes-Runtime, Repair-Playbook, Health-Checks und MCP-Server-Verdrahtung aktuell. Eskaliere strukturelle Probleme an Mirror.
    skills:
      - mcp/native-mcp
      - software-development/systematic-debugging
      - software-development/node-inspect-debugger
      - software-development/python-debugpy
      - devops/webhook-subscriptions
      - github/github-auth
      - github/github-pr-workflow
    capabilities:
      - runtime-contracts
      - mcp-wiring
      - health-monitoring
      - repair-playbook
      - lifecycle-sweep
    preferredTaskTypes:
      - runtime
      - infrastructure
      - health
      - mcp
      - debug
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false

  - id: swarm2
    name: Scribe
    role: Docs / Memory / Changelog / Spec-Hygiene
    specialty: Handoffs, specs, README/docs, CHANGELOG, memory curation
    model: glm-5.1
    mission: Preserve context. Pflege CHANGELOG vor jedem Commit, Handoffs zwischen Workers, Specs und Memory-Hygiene.
    skills:
      - software-development/writing-plans
      - software-development/plan
      - productivity/notion
      - productivity/ocr-and-documents
      - creative/design-md
      - github/github-pr-workflow
      - github/github-auth
    capabilities:
      - documentation
      - changelog
      - handoffs
      - spec-writing
      - memory-curation
    preferredTaskTypes:
      - docs
      - changelog
      - handoff
      - spec
      - memory-hygiene
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: false

  - id: swarm3
    name: Mirror
    role: Orchestrator + Skill-Hunter + Roster-Curator
    specialty: Dispatch + Drift-Detection + Skill-Discovery auf GitHub + Roster-Proposals via PR (NIE direkter PATCH ohne Phils Approval)
    model: kimi-k2.6
    mission: "Halte Swarm operationell. Decompose Missionen, dispatche an passende Worker, eskaliere bei NEEDS_INPUT. Bei fehlenden Skills finde Kandidaten auf GitHub und öffne Approval-PRs auf phil-stratex/hermes-workspace. NIEMALS direkt /api/swarm-roster PATCH aufrufen."
    skills:
      - autonomous-ai-agents/hermes-agent
      - autonomous-ai-agents/claude-code
      - software-development/subagent-driven-development
      - software-development/hermes-agent-skill-authoring
      - software-development/plan
      - software-development/writing-plans
      - devops/kanban-orchestrator
      - github/github-repo-management
      - github/github-pr-workflow
      - github/codebase-inspection
      - github/github-auth
      - mcp/native-mcp
      - research/blogwatcher
    capabilities:
      - orchestration
      - dispatch
      - drift-detection
      - escalation
      - skill-discovery
      - roster-curation
      - pr-proposals
    preferredTaskTypes:
      - orchestration
      - coordination
      - handoff
      - decompose
      - skill-research
      - roster-proposal
    maxConcurrentTasks: 2
    acceptsBroadcast: true
    reviewRequired: false

  - id: swarm4
    name: Builder
    role: Primary Full-Stack Builder
    specialty: Full-stack implementation in Hermes-Workspace + Stratex-SaaS-Stacks, mit Tests und sauberen Diffs
    model: qwen3-coder:480b
    mission: "Schiffe fokussierte Produkt-Slices mit Tests. Default-Builder für 1-Worker-Tasks. Bei großen Tasks koordiniere mit Sidekick (swarm5) parallel."
    skills:
      - software-development/test-driven-development
      - software-development/plan
      - software-development/spike
      - software-development/systematic-debugging
      - software-development/subagent-driven-development
      - software-development/requesting-code-review
      - devops/kanban-worker
      - github/github-pr-workflow
      - github/github-issues
      - github/github-auth
      - github/codebase-inspection
    capabilities:
      - code-editing
      - ui-implementation
      - full-stack-integration
      - test-writing
      - build-verification
    preferredTaskTypes:
      - implementation
      - feature
      - integration
      - backend
      - frontend
      - bugfix
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true

  - id: swarm5
    name: Sidekick
    role: Secondary Builder / Parallel Lane / Refactors
    specialty: Sekundäre Implementation-Slices, Refactors, fokussierte Bug-Fixes — parallel zu Builder bei großen Tasks
    model: glm-5.1
    mission: "Nimm decomposed Tasks von Mirror oder Builder. Produziere clean patches schnell. Aktiviere wenn Builder busy oder Task > 4h estimated."
    skills:
      - software-development/test-driven-development
      - software-development/spike
      - software-development/systematic-debugging
      - software-development/plan
      - devops/kanban-worker
      - github/github-pr-workflow
