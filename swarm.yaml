      - patch
      - implementation
      - backend
      - frontend
      - parallel-task
    maxConcurrentTasks: 1
    acceptsBroadcast: true
    reviewRequired: true

  - id: swarm6
    name: Reviewer
    role: Byte-verified Review-Gate / Merge-Readiness
    specialty: Code review, regression detection, test coverage, naming-sensitive changes, generated-file sanity
    model: kimi-k2.6
    mission: "Catch breakage bevor sie Phil erreicht. Verdict APPROVED|CHANGES_REQUESTED|BLOCKED mit byte-Evidenz. NIEMALS auto-mergen."
    skills:
